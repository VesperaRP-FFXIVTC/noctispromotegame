<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>VESPERA — 黃昏的異空間</title>
  <link rel="stylesheet" href="css/style.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600&family=Noto+Serif+TC:wght@300;400&display=swap" rel="stylesheet" />
</head>
<body>
  <div id="app">

    <!-- ===== ENTRY SCREEN ===== -->
    <div id="screen-entry" class="screen active">
      <div class="entry-bg"></div>
      <div class="entry-content">
        <h1 class="title-main">VESPERA</h1>
        <p class="title-sub">黃昏的異空間</p>
        <div class="story-intro">
          <p>你不知道自己是怎麼來到這裡的。</p>
          <p>四周瀰漫著淡淡的霧氣，遠處有兩盞燈——<br/>
          一盞暖黃，一盞幽紫。</p>
          <p>有人說，只要選擇其中一條路，就能回到現實。<br/>
          但也有人說，有些路，一旦踏入，就再也回不來了。</p>
          <p class="intro-note">— 冒險者公會的委託，正等著你。</p>
        </div>
        <div class="name-input-area">
          <label for="player-name">你的名字</label>
          <input type="text" id="player-name" placeholder="輸入你的名字..." maxlength="20" />
          <button id="btn-start" onclick="startGame()">踏入 VESPERA</button>
        </div>
      </div>
    </div>

    <!-- ===== GAME SCREEN ===== -->
    <div id="screen-game" class="screen">
      <div id="game-bg" class="game-bg"></div>
      <div id="game-overlay" class="game-overlay"></div>

      <!-- Character sprite -->
      <div id="char-sprite" class="char-sprite"></div>

      <!-- Dialogue box -->
      <div id="dialogue-box" class="dialogue-box">
        <div id="speaker-name" class="speaker-name"></div>
        <div id="dialogue-text" class="dialogue-text"></div>
        <div id="dialogue-next" class="dialogue-next">▼</div>
      </div>

      <!-- Choices -->
      <div id="choices-box" class="choices-box hidden"></div>

      <!-- Puzzle overlay -->
      <div id="puzzle-overlay" class="puzzle-overlay hidden">
        <div id="puzzle-container" class="puzzle-container"></div>
      </div>

      <!-- Inventory / clues collected -->
      <div id="clue-panel" class="clue-panel hidden">
        <div class="clue-title">收集到的線索</div>
        <div id="clue-list"></div>
      </div>
      <button id="btn-clues" class="btn-clues hidden" onclick="toggleClues()">線索</button>
      <!-- 測試用跳過按鈕 -->
      <button id="btn-skip" class="btn-skip" onclick="skipToScene()" title="測試用：跳過到下一幕">⏩ 跳過</button>
    </div>

    <!-- ===== COUNTDOWN SCREEN ===== -->
    <div id="screen-countdown" class="screen">
      <div class="countdown-bg"></div>
      <!-- 粒子容器 -->
      <canvas id="countdown-particles" class="countdown-particles"></canvas>
      <div class="countdown-content">
        <p class="countdown-arrived">— 你找到了這裡 —</p>
        <p class="countdown-label">NOCTIS</p>
        <p class="countdown-sublabel">深夜正在等待你</p>
        <div class="countdown-divider"></div>
        <p class="countdown-opening-date">開幕倒數</p>
        <div id="countdown-timer" class="countdown-timer">
          <div class="cd-block">
            <span id="cd-days">00</span>
            <span class="cd-unit">天</span>
          </div>
          <span class="cd-colon">:</span>
          <div class="cd-block">
            <span id="cd-hours">00</span>
            <span class="cd-unit">時</span>
          </div>
          <span class="cd-colon">:</span>
          <div class="cd-block">
            <span id="cd-mins">00</span>
            <span class="cd-unit">分</span>
          </div>
          <span class="cd-colon">:</span>
          <div class="cd-block">
            <span id="cd-secs">00</span>
            <span class="cd-unit">秒</span>
          </div>
        </div>
        <a id="btn-official" href="https://vesperarp-ffxivtc.github.io/NOCTIS-RP/" target="_blank" class="btn-official">前往 NOCTIS 官網</a>
      </div>
    </div>

  </div>

  <script src="js/scenes.js"></script>
  <script src="js/puzzles.js"></script>
  <script src="js/engine.js"></script>

  <script>
  // 粒子效果 — 倒數頁專用
  function initCountdownParticles() {
    const canvas = document.getElementById('countdown-particles');
    if (!canvas) return;
    const ctx = canvas.getContext('2d');

    function resize() {
      canvas.width  = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    resize();
    window.addEventListener('resize', resize);

    const particles = Array.from({ length: 60 }, () => ({
      x: Math.random() * window.innerWidth,
      y: Math.random() * window.innerHeight,
      r: Math.random() * 1.5 + 0.5,
      dx: (Math.random() - 0.5) * 0.3,
      dy: -Math.random() * 0.5 - 0.2,
      alpha: Math.random() * 0.5 + 0.1,
      pulse: Math.random() * Math.PI * 2
    }));

    function draw() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      particles.forEach(p => {
        p.pulse += 0.02;
        p.alpha = 0.15 + Math.sin(p.pulse) * 0.12;
        p.x += p.dx;
        p.y += p.dy;
        if (p.y < -10) { p.y = canvas.height + 10; p.x = Math.random() * canvas.width; }
        if (p.x < -10) p.x = canvas.width + 10;
        if (p.x > canvas.width + 10) p.x = -10;

        ctx.beginPath();
        ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
        ctx.fillStyle = `rgba(192, 132, 252, ${p.alpha})`;
        ctx.fill();
      });
      requestAnimationFrame(draw);
    }
    draw();
  }

  // 當倒數頁顯示時啟動粒子
  const _origShowCountdown = window.showCountdown;
  document.addEventListener('DOMContentLoaded', () => {
    const observer = new MutationObserver(() => {
      const screen = document.getElementById('screen-countdown');
      if (screen && screen.classList.contains('active')) {
        initCountdownParticles();
        observer.disconnect();
      }
    });
    observer.observe(document.getElementById('app'), { attributes: true, subtree: true, attributeFilter: ['class'] });
  });
  </script>
</body>
</html>
